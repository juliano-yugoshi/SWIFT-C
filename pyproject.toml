[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swiftc-clustering"
version = "0.1.0"
description = "Unified semantic weak-label integration framework for clustering"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "numpy>=1.26", "pandas>=2.0", "scipy>=1.11",
  "scikit-learn>=1.4", "threadpoolctl>=3.0",
  "rich>=13.7", "tabulate>=0.9"
]

[project.optional-dependencies]
qwen = ["sentence-transformers>=4.1", "torch>=2.2", "transformers>=4.51"]
deep = ["torch>=2.2"]
plots = ["matplotlib>=3.8"]
test = ["pytest>=8"]
all = ["sentence-transformers>=4.1", "torch>=2.2", "transformers>=4.51", "matplotlib>=3.8", "pytest>=8"]

[project.scripts]
swiftc = "swiftc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
